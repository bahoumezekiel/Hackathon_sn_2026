# FasoLink — plateforme complète
#   python scripts/init_env.py      (une fois : génère .env avec des secrets aléatoires)
#   docker compose up -d --build
#
# Plateforme de DÉMONSTRATION : Vault en mode dev, Keycloak en start-dev,
# aucune donnée persistée (tout est réinitialisé à chaque démarrage).

x-fasolink-env: &fasolink-env
  FASOLINK_DATABASE_URL: postgresql://fasolink:${POSTGRES_PASSWORD:?Lancez scripts/init_env.py}@postgres:5432/fasolink
  FASOLINK_ADMIN_DATABASE_URL: postgresql://fasolink:${POSTGRES_PASSWORD}@postgres:5432/postgres
  FASOLINK_REDIS_URL: redis://:${REDIS_PASSWORD:?}@redis:6379/0
  FASOLINK_OPA_URL: http://opa:8181
  FASOLINK_VAULT_ADDR: http://vault:8200
  FASOLINK_VAULT_TOKEN: ${VAULT_GATEWAY_TOKEN:?}
  FASOLINK_KEYCLOAK_URL: http://keycloak:8080
  FASOLINK_KEYCLOAK_PUBLIC_URL: http://localhost:8080
  FASOLINK_KEYCLOAK_REALM: fasolink
  FASOLINK_REGISTRY_TOKEN: ${FASOLINK_REGISTRY_TOKEN:?}
  FASOLINK_REGISTRY_ETAT_CIVIL_URL: http://registry-etat-civil:8000
  FASOLINK_REGISTRY_NATIONALITE_URL: http://registry-nationalite:8000
  FASOLINK_REGISTRY_CASIER_URL: http://registry-casier:8000
  FASOLINK_DEMO_MODE: "1"

x-registry: &registry
  image: fasolink/app:dev        # construite par le service gateway
  pull_policy: never
  command: ["uvicorn", "app:app", "--app-dir", "registries-mock", "--host", "0.0.0.0", "--port", "8000"]
  healthcheck:
    test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
    interval: 5s
    timeout: 3s
    retries: 10

services:
  # ------------------------------------------------------------ données
  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: fasolink
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: fasolink
    # Non exposé sur l'hôte : accessible uniquement depuis le réseau Docker
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U fasolink -d fasolink"]
      interval: 3s
      timeout: 3s
      retries: 20

  redis:
    image: redis:7.4-alpine
    command: ["redis-server", "--requirepass", "${REDIS_PASSWORD}", "--appendonly", "yes"]
    ports: ["127.0.0.1:6379:6379"]
    healthcheck:
      test: ["CMD-SHELL", "redis-cli -a \"$$REDIS_PASSWORD\" --no-auth-warning ping | grep -q PONG"]
      interval: 3s
      timeout: 3s
      retries: 20
    environment:
      REDIS_PASSWORD: ${REDIS_PASSWORD}

  # ------------------------------------------------------------ sécurité
  vault:
    image: hashicorp/vault:1.18
    environment:
      VAULT_DEV_ROOT_TOKEN_ID: ${VAULT_ROOT_TOKEN:?}
      VAULT_DEV_LISTEN_ADDRESS: 0.0.0.0:8200
      SKIP_SETCAP: "true"
    ports: ["127.0.0.1:8200:8200"]
    healthcheck:
      test: ["CMD", "vault", "status", "-address=http://127.0.0.1:8200"]
      interval: 3s
      timeout: 3s
      retries: 20

  vault-init:
    image: hashicorp/vault:1.18
    depends_on:
      vault: { condition: service_healthy }
    environment:
      VAULT_ADDR: http://vault:8200
      VAULT_TOKEN: ${VAULT_ROOT_TOKEN}
      VAULT_GATEWAY_TOKEN: ${VAULT_GATEWAY_TOKEN}
    volumes:
      - ./infra/vault:/init:ro
    entrypoint: ["/bin/sh", "/init/init.sh"]
    restart: "no"

  keycloak:
    image: quay.io/keycloak/keycloak:26.0.8   # version figée : le thème dépend de ses scripts
    command: ["start-dev", "--import-realm"]
    environment:
      KC_BOOTSTRAP_ADMIN_USERNAME: admin
      KC_BOOTSTRAP_ADMIN_PASSWORD: ${KEYCLOAK_ADMIN_PASSWORD:?}
      KC_HOSTNAME: http://localhost:8080
      KC_HOSTNAME_BACKCHANNEL_DYNAMIC: "true"
      KC_HTTP_ENABLED: "true"
      KC_HEALTH_ENABLED: "true"
    ports: ["127.0.0.1:8080:8080"]
    volumes:
      - ./infra/keycloak/realm-fasolink.json:/opt/keycloak/data/import/realm-fasolink.json:ro
      - ./infra/keycloak/themes/fasolink:/opt/keycloak/themes/fasolink:ro
    healthcheck:
      test: ["CMD-SHELL", "exec 3<>/dev/tcp/127.0.0.1/9000 && printf 'GET /health/ready HTTP/1.1\\r\\nHost: localhost\\r\\nConnection: close\\r\\n\\r\\n' >&3 && grep -q '\"UP\"' <&3"]
      interval: 5s
      timeout: 5s
      retries: 40

  opa:
    image: openpolicyagent/opa:1.0.0
    command: ["run", "--server", "--addr=0.0.0.0:8181", "--set=decision_logs.console=true",
              "--ignore=*_test.rego", "/policies"]
    ports: ["127.0.0.1:8181:8181"]
    volumes:
      - ./policies:/policies:ro

  # ------------------------------------------------------------ registres simulés
  registry-etat-civil:
    <<: *registry
    environment:
      REGISTRY_CODE: ETAT_CIVIL
      FASOLINK_REGISTRY_TOKEN: ${FASOLINK_REGISTRY_TOKEN}

  registry-nationalite:
    <<: *registry
    environment:
      REGISTRY_CODE: NATIONALITE
      FASOLINK_REGISTRY_TOKEN: ${FASOLINK_REGISTRY_TOKEN}

  registry-casier:
    <<: *registry
    environment:
      REGISTRY_CODE: CASIER
      FASOLINK_REGISTRY_TOKEN: ${FASOLINK_REGISTRY_TOKEN}

  # ------------------------------------------------------------ FasoLink
  fasolink-init:
    image: fasolink/app:dev
    pull_policy: never
    command: ["python", "scripts/seed_demo.py", "--reset"]
    environment: *fasolink-env
    depends_on:
      postgres: { condition: service_healthy }
      vault-init: { condition: service_completed_successfully }
    restart: "no"

  gateway:
    build: .
    image: fasolink/app:dev
    environment: *fasolink-env
    ports: ["127.0.0.1:8000:8000"]
    depends_on:
      fasolink-init: { condition: service_completed_successfully }
      redis: { condition: service_healthy }
      opa: { condition: service_started }
      keycloak: { condition: service_healthy }
      registry-etat-civil: { condition: service_healthy }
      registry-nationalite: { condition: service_healthy }
      registry-casier: { condition: service_healthy }
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://localhost:8000/health')"]
      interval: 5s
      timeout: 3s
      retries: 20

  # ------------------------------------------------------------ portails React (un par rôle)
  portal-agent:
    build: { context: ./frontend, args: { APP: agent } }
    image: fasolink/portal-agent:dev
    environment:
      KEYCLOAK_URL: http://localhost:8080   # autorisé par la politique de sécurité du contenu
    ports: ["127.0.0.1:3001:80"]
    depends_on:
      gateway: { condition: service_healthy }

  portal-citizen:
    build: { context: ./frontend, args: { APP: citizen } }
    image: fasolink/portal-citizen:dev
    environment:
      KEYCLOAK_URL: http://localhost:8080
    ports: ["127.0.0.1:3002:80"]
    depends_on:
      gateway: { condition: service_healthy }

  portal-supervision:
    build: { context: ./frontend, args: { APP: supervision } }
    image: fasolink/portal-supervision:dev
    environment:
      KEYCLOAK_URL: http://localhost:8080
    ports: ["127.0.0.1:3003:80"]
    depends_on:
      gateway: { condition: service_healthy }
