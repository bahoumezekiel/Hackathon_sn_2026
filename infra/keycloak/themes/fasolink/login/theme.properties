import=common/keycloak

# tokens.css et fonts/ sont copiés depuis design/ par scripts/sync_design.py
styles=css/login.css css/tokens.css css/fasolink.css

meta=viewport==width=device-width,initial-scale=1

# Affiche les comptes de démonstration sous le formulaire (mettre false hors démo)
fasolinkDemo=true
