# Thème de connexion FasoLink : gabarit propre, sans PatternFly ni police d'icônes.
parent=base
styles=css/login.css
meta=viewport==width=device-width,initial-scale=1 color-scheme==light

# Classes injectées dans les pages héritées de « base » (erreur, information, déconnexion…)
kcBodyClass=fl-body
kcFormGroupClass=fl-field
kcLabelClass=fl-label
kcInputClass=fl-input
kcInputGroup=fl-input-group
kcInputErrorMessageClass=fl-error
kcAlertClass=fl-alert
kcFormButtonsClass=fl-actions
kcButtonClass=fl-btn
kcButtonPrimaryClass=fl-btn--primary
kcButtonDefaultClass=fl-btn--secondary
kcButtonBlockClass=fl-btn--block
kcFormPasswordVisibilityButtonClass=fl-reveal
